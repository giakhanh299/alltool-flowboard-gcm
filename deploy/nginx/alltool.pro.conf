server {
    listen 80;
    listen [::]:80;
    server_name alltool.pro www.alltool.pro;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name alltool.pro www.alltool.pro;
    server_tokens off;
    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/alltool.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alltool.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/alltool.pro/html;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8025/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
